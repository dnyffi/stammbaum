<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Änderungsverlauf – Stammbaum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0e2748; --night-deep:#091b33; --night-raised:#15365f;
    --gold-soft:#ecd892; --parchment:#f4ecda; --parchment-edge:#d8c69b; --ink:#1d2433;
    --red:#b3261e; --green:#4f6b2a;
    --serif:'Alegreya',Georgia,serif; --sans:'Alegreya Sans','Gill Sans',sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--sans); color:var(--parchment); background:linear-gradient(180deg, var(--night) 0%, var(--night-deep) 100%) fixed; min-height:100vh; }
  a{ color:var(--gold-soft); }
  .bar{
    position:sticky; top:0; z-index:10; background:rgba(9,27,51,.97); border-bottom:1px solid rgba(236,216,146,.25);
    padding:calc(env(safe-area-inset-top, 0px) + .55rem) .8rem .55rem; display:flex; flex-wrap:wrap; gap:.5rem .9rem; align-items:center;
  }
  .bar h1{ margin:0; font-family:var(--serif); font-weight:500; font-size:1.25rem; }
  .bar input, .bar select{ font:inherit; font-size:.95rem; color:var(--ink); background:var(--parchment); border:1px solid var(--parchment-edge); border-radius:.45rem; padding:.3rem .5rem; }
  .bar input[type=search]{ width:13rem; max-width:55vw; }
  main{ max-width:900px; margin:0 auto; padding:1rem .8rem 4rem; }
  .day{ font-family:var(--serif); color:var(--gold-soft); font-size:1.1rem; margin:1.2rem 0 .5rem; border-bottom:1px solid rgba(236,216,146,.25); padding-bottom:.2rem; }
  .entry{ background:rgba(244,236,218,.06); border:1px solid rgba(236,216,146,.22); border-radius:.6rem; padding:.6rem .75rem; margin-bottom:.5rem; }
  .entry .head{ display:flex; flex-wrap:wrap; gap:.3rem .7rem; align-items:baseline; }
  .entry .who{ font-weight:700; }
  .entry .time{ font-size:.85rem; opacity:.75; }
  .tag{ font-size:.75rem; border-radius:999px; padding:.05rem .5rem; color:#fff; }
  .tag.insert{ background:var(--green); } .tag.update{ background:#1f5aa6; }
  .hinweis{ margin-top:.4rem; font-size:.85rem; color:rgba(244,236,218,.7); word-wrap:break-word; white-space:pre-wrap; }
  .msg{ padding:1rem; border-radius:.6rem; background:rgba(244,236,218,.08); margin:1rem 0; line-height:1.45; }
  .more{ display:block; margin:1rem auto; font:inherit; background:var(--parchment); color:var(--ink); border:0; border-radius:.5rem; padding:.5rem 1rem; cursor:pointer; }
</style>
</head>
<body>
<div class="bar">
  <a href="index.html">← Stammbaum</a>
  <h1>Änderungsverlauf</h1>
  <input type="search" id="q" placeholder="Person oder Bearbeiter filtern">
  <select id="kind"><option value="">Alle Änderungen</option><option value="insert">Nur neue Einträge</option><option value="update">Nur Änderungen</option></select>
</div>
<main id="out"><div class="msg">Lade Verlauf …</div></main>

<script src="config.js"></script>
<script>
(function(){
  'use strict';
  const CFG = window.APPSCRIPT_CONFIG || {};
  const DB_READY = !!(CFG.url && CFG.url.indexOf('DEINE-') === -1);
  const API = DB_READY ? CFG.url.replace(/\/$/, '') : null;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const out = document.getElementById('out');
  const decodeWho = w => { try { return decodeURIComponent(w || ''); } catch(e){ return w || ''; } };
  let PEOPLE = {}, ROWS = [];
  const PAGE = 150;
  let shown = PAGE;
  const pname = id => { const p = PEOPLE[id]; return p ? [p.vorname, p.zweitname, p.nachname].filter(Boolean).join(' ') : (id != null && id !== '' ? 'ID ' + id : '–'); };
  const AKTION_LABEL = { insert: 'neu', update: 'geändert' };

  // Laedt Personen + Aenderungen in einem Aufruf vom Apps-Script-Backend.
  // (Das Backend kennt kein serverseitiges Filtern/Paginieren wie Supabase -
  // wir holen einmal alles und blaettern/filtern im Browser.)
  async function loadAll(){
    const r = await fetch(API + '?resource=all&_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    (data.personen || []).forEach(p => PEOPLE[p.id] = p);
    ROWS = (data.aenderungen || []).slice().sort((a, b) => {
      const za = new Date(a.zeit).getTime(), zb = new Date(b.zeit).getTime();
      return zb - za || (b.id - a.id);
    });
  }

  function render(){
    const q = document.getElementById('q').value.trim().toLowerCase();
    const kind = document.getElementById('kind').value;
    const list = ROWS.filter(e => (!kind || e.aktion === kind) &&
      (!q || pname(e.person_id).toLowerCase().includes(q) || decodeWho(e.wer).toLowerCase().includes(q)));
    let html = '', lastDay = '';
    const visible = list.slice(0, shown);
    visible.forEach(e => {
      const d = new Date(e.zeit);
      const day = d.toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      if (day !== lastDay){ html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
      const time = d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
      const tag = AKTION_LABEL[e.aktion] || e.aktion;
      html += `<div class="entry">
        <div class="head"><span class="tag ${esc(e.aktion)}">${esc(tag)}</span>
          <a href="index.html#/person/${esc(e.person_id)}" class="who">${esc(pname(e.person_id))}</a>
          <span class="time">${esc(time)} · von ${esc(decodeWho(e.wer) || 'unbekannt')}</span></div>
        <div class="hinweis">${esc(e.hinweis || '')}</div></div>`;
    });
    if (!visible.length) html = '<div class="msg">Noch keine Änderungen für diese Auswahl.</div>';
    if (list.length > shown) html += '<button class="more" id="more">Ältere Änderungen laden</button>';
    out.innerHTML = html;
    const mb = document.getElementById('more');
    if (mb) mb.addEventListener('click', () => { shown += PAGE; render(); });
  }

  document.getElementById('q').addEventListener('input', () => { shown = PAGE; render(); });
  document.getElementById('kind').addEventListener('change', () => { shown = PAGE; render(); });

  (async function(){
    if (!DB_READY){ out.innerHTML = '<div class="msg">Keine Datenbank verbunden. Der Verlauf ist nur mit Datenbank verfügbar.</div>'; return; }
    const params = new URLSearchParams(location.search);
    try {
      await loadAll();
      if (params.get('person') && PEOPLE[params.get('person')]) document.getElementById('q').value = pname(Number(params.get('person')));
      render();
    } catch(e){
      out.innerHTML = '<div class="msg">Fehler beim Laden: ' + esc(e.message) + '</div>';
    }
  })();
})();
</script>
</body>
</html>
