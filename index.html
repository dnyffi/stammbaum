<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stammbaum · Nyffenegger · Meier · Künzi · Wetli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Dunkelblau elegant (vom Wappen inspiriert) */
    --dark-blue: #0a3d7a;
    --dark-blue-lighter: #1a5fa8;
    --dark-blue-lighter2: #2a6eb5;
    --gold: #d4af37;
    --gold-light: #f0e68c;
    --cream: #f5f1e8;
    --cream-dark: #e8dcc8;
    --red: #c31f18;
    --green: #5c6e28;
    
    --ink: #0f0d0a;
    --ink-soft: #4a4340;
    --text-light: #e8dcc8;
    
    --shadow-soft: 0 2px 6px rgba(0,0,0,0.15);
    --shadow-med: 0 8px 16px rgba(0,0,0,0.25);
    --shadow-dark: 0 12px 32px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background: linear-gradient(135deg, var(--dark-blue) 0%, #052d5a 50%, #0a3d7a 100%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ===== LAYOUT GRID ===== */
  #app-container {
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    gap: 0;
  }

  /* ===== HEADER/TITLE BAR ===== */
  header {
    grid-column: 1 / -1;
    grid-row: 1;
    background: linear-gradient(180deg, var(--dark-blue) 0%, var(--dark-blue-lighter) 100%);
    padding: 1rem 1.5rem;
    border-bottom: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    box-shadow: var(--shadow-med);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .menu-toggle {
    background: none;
    border: none;
    color: var(--gold);
    font-size: 1.6rem;
    cursor: pointer;
    padding: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, color 0.2s;
  }

  .menu-toggle:hover {
    transform: scale(1.1);
    color: var(--gold-light);
  }

  .crest {
    width: 56px;
    height: auto;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }

  .header-title {
    display: flex;
    flex-direction: column;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    margin: 0;
    color: var(--cream);
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    letter-spacing: 0.02em;
  }

  header .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-light);
    margin: 0;
  }

  .header-right {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .icon-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--gold);
    color: var(--gold);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    background: rgba(212,175,55,0.2);
    transform: scale(1.05);
  }

  /* ===== SIDEBAR MENU ===== */
  .sidebar {
    grid-column: 1;
    grid-row: 2;
    background: var(--dark-blue);
    border-right: 2px solid var(--gold);
    padding: 1.5rem 1rem;
    width: 280px;
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 90;
    box-shadow: 2px 0 8px rgba(0,0,0,0.3);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar h2 {
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    color: var(--gold);
    margin: 1.5rem 0 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 0.5rem;
  }

  .sidebar h2:first-child {
    margin-top: 0;
  }

  .search-group {
    margin-bottom: 1.5rem;
  }

  #search {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border: 1px solid var(--gold);
    background: var(--cream);
    color: var(--ink);
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    transition: box-shadow 0.2s;
  }

  #search:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(212,175,55,0.3);
  }

  #search-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--gold-light);
    margin-top: 0.3rem;
    display: block;
  }

  .menu-group {
    margin-bottom: 1.5rem;
  }

  .menu-group button {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    padding: 0.7rem 0.9rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--cream);
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    transition: all 0.2s;
    margin-bottom: 0.5rem;
  }

  .menu-group button:hover {
    background: rgba(212,175,55,0.15);
    border-color: var(--gold);
  }

  #jump {
    width: 100%;
    padding: 0.7rem 0.9rem;
    background: var(--cream);
    border: 1px solid var(--gold);
    color: var(--ink);
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }

  /* ===== LEGEND ===== */
  .legend {
    grid-column: 3;
    grid-row: 2;
    background: var(--dark-blue);
    border-left: 2px solid var(--gold);
    padding: 1.5rem 1rem;
    width: 240px;
    overflow-y: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-light);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px dashed rgba(212,175,55,0.3);
  }

  .legend-item:last-child {
    border-bottom: none;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ===== MAIN CONTENT AREA ===== */
  main {
    grid-column: 2;
    grid-row: 2;
    overflow: auto;
    background: linear-gradient(135deg, rgba(250,245,235,0.02) 0%, transparent 100%);
    padding: 2rem;
    scroll-behavior: smooth;
  }

  main::-webkit-scrollbar {
    width: 8px;
  }

  main::-webkit-scrollbar-track {
    background: transparent;
  }

  main::-webkit-scrollbar-thumb {
    background: var(--gold);
    border-radius: 4px;
  }

  main::-webkit-scrollbar-thumb:hover {
    background: var(--gold-light);
  }

  #main {
    max-width: 100%;
  }

  /* ===== ZOOM CONTROLS ===== */
  .zoom-controls {
    position: fixed;
    bottom: 3rem;
    right: 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 80;
  }

  .zoom-btn {
    width: 44px;
    height: 44px;
    background: var(--dark-blue);
    border: 2px solid var(--gold);
    color: var(--gold);
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: var(--shadow-med);
  }

  .zoom-btn:hover {
    background: var(--dark-blue-lighter);
    transform: scale(1.1);
  }

  .zoom-level {
    text-align: center;
    font-size: 0.75rem;
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ===== FOOTER ===== */
  footer {
    grid-column: 1 / -1;
    grid-row: 3;
    background: var(--dark-blue);
    border-top: 2px solid var(--gold);
    padding: 1rem;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold-light);
  }

  /* ===== AHNENTAFEL TREE STYLES ===== */
  .branch {
    margin: 3rem auto 0;
    max-width: fit-content;
  }

  .branch-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1.2rem;
    color: var(--cream);
    text-align: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    border-bottom: 2px solid var(--gold);
    display: inline-block;
    left: 50%;
    position: relative;
    transform: translateX(-50%);
  }

  .branch-title .branch-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 0.6rem;
    vertical-align: middle;
  }

  .tree-scroll {
    overflow-x: auto;
    padding: 1rem 2rem 2rem;
  }

  /* CSS Org-Chart Connectors */
  ul.tree, ul.tree ul {
    list-style: none;
    margin: 0;
    padding-top: 32px;
    position: relative;
    display: flex;
    justify-content: center;
  }

  ul.tree {
    padding-top: 0;
  }

  ul.tree li {
    position: relative;
    padding: 32px 18px 0;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  ul.tree li::before, ul.tree li::after {
    content: '';
    position: absolute;
    top: 0;
    border-top: 2px solid var(--gold);
  }

  ul.tree li::before {
    right: 50%;
    width: 50%;
  }

  ul.tree li::after {
    left: 50%;
    width: 50%;
    border-left: 2px solid var(--gold);
  }

  ul.tree li:only-child {
    padding-top: 0;
  }

  ul.tree li:only-child::before, ul.tree li:only-child::after {
    display: none;
  }

  ul.tree li:first-child::before {
    border: none;
  }

  ul.tree li:last-child::after {
    border: none;
  }

  ul.tree li:last-child::before {
    border-right: 2px solid var(--gold);
  }

  ul.tree li:first-child::after {
    border-radius: 0;
  }

  ul.tree > li {
    padding-top: 0;
  }

  ul.tree ul::before {
    content: '';
    position: absolute;
    top: -32px;
    left: 50%;
    border-left: 2px solid var(--gold);
    width: 0;
    height: 32px;
  }

  li.node-li > .connector-down {
    position: relative;
    height: 32px;
    width: 2px;
    background: var(--gold);
    margin: 0 auto;
  }

  li.node-li.no-children > .connector-down {
    display: none;
  }

  /* ===== CARD STYLES ===== */
  .unit {
    display: flex;
    align-items: stretch;
    gap: 0;
    position: relative;
  }

  .card {
    background: var(--cream);
    border: 2px solid var(--gold);
    border-radius: 2px;
    padding: 0.7rem 0.9rem;
    min-width: 160px;
    max-width: 210px;
    box-shadow: var(--shadow-soft);
    position: relative;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
  }

  .card:hover {
    box-shadow: var(--shadow-med);
    transform: translateY(-2px);
  }

  .card .name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--dark-blue);
    margin: 0 0 0.25rem;
  }

  .card .dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin: 0.1rem 0;
  }

  .card .gender {
    font-size: 0.65rem;
    color: var(--ink-soft);
  }

  .card.match {
    box-shadow: 0 0 0 3px var(--red), var(--shadow-med);
  }

  .card.dim {
    opacity: 0.3;
  }

  .edit-btn {
    position: absolute;
    top: -11px;
    right: -11px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--dark-blue);
    color: var(--dark-blue);
    font-size: 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-soft);
    z-index: 6;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .card:hover .edit-btn, .card:focus-within .edit-btn {
    opacity: 1;
  }

  @media (hover: none) {
    .edit-btn {
      opacity: 1;
    }
  }

  .toggle {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--green);
    color: var(--cream);
    border: 2px solid var(--dark-blue);
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-soft);
    font-family: 'IBM Plex Mono', monospace;
    z-index: 5;
    transition: all 0.2s;
  }

  .toggle:hover {
    transform: translateX(-50%) scale(1.1);
  }

  .children-wrap.collapsed {
    display: none;
  }

  /* Subtle Rotation */
  li.node-li:nth-child(3n) .card {
    transform: rotate(-0.4deg);
  }

  li.node-li:nth-child(5n) .card {
    transform: rotate(0.5deg);
  }

  /* ===== DETAIL VIEW ===== */
  #view-detail {
    padding: 2rem;
    max-width: 800px;
    margin: 0 auto;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--gold);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    border-bottom: 1px dashed var(--gold);
  }

  .back-link:hover {
    color: var(--gold-light);
  }

  .ancestor-ladder {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .ancestor-row {
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .detail-card {
    background: var(--cream);
    border: 3px solid var(--gold);
    border-radius: 3px;
    padding: 1.2rem;
    min-width: 240px;
    max-width: 360px;
    box-shadow: var(--shadow-med);
    position: relative;
  }

  .detail-card .name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--dark-blue);
    margin-bottom: 0.3rem;
  }

  .detail-card .dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .detail-fields {
    margin: 1rem 0 0;
    padding-top: 1rem;
    border-top: 2px dashed var(--gold);
  }

  .detail-fields dt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--dark-blue);
    margin-top: 0.6rem;
    font-weight: 600;
  }

  .detail-fields dd {
    margin: 0.2rem 0 0;
    font-size: 0.9rem;
    color: var(--ink);
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,13,10,0.7);
    z-index: 300;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-y: auto;
  }

  .modal-card {
    background: var(--cream);
    border: 2px solid var(--gold);
    border-radius: 4px;
    width: 100%;
    max-width: 500px;
    box-shadow: var(--shadow-dark);
    padding: 1.5rem;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .modal-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.3rem;
    margin: 0;
    color: var(--dark-blue);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    color: var(--ink-soft);
    padding: 0;
  }

  .modal-body {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .modal-body label {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-size: 0.75rem;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .modal-body input, .modal-body select, .modal-body textarea {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    padding: 0.5rem 0.7rem;
    border-radius: 3px;
    border: 1px solid var(--gold);
    background: white;
    color: var(--ink);
  }

  .modal-foot {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    margin-top: 1.2rem;
  }

  .modal-foot button {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
    border-radius: 999px;
    border: 1px solid var(--gold);
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
  }

  .modal-foot button:hover {
    background: var(--cream-dark);
  }

  .modal-foot button.primary {
    background: var(--green);
    color: var(--cream);
    border-color: var(--green);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1200px) {
    .legend {
      width: 180px;
      font-size: 0.65rem;
      padding: 1rem;
    }
  }

  @media (max-width: 992px) {
    #app-container {
      grid-template-columns: 1fr auto;
    }

    .legend {
      display: none;
    }

    header {
      padding: 0.8rem 1rem;
    }

    header h1 {
      font-size: 1.4rem;
    }

    main {
      padding: 1rem;
    }
  }

  @media (max-width: 640px) {
    #app-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
    }

    .legend {
      display: none;
    }

    .sidebar {
      width: 100%;
      position: fixed;
      top: 64px;
      left: 0;
      height: calc(100vh - 128px);
      z-index: 90;
    }

    header {
      padding: 0.7rem;
    }

    .crest {
      width: 48px;
    }

    header h1 {
      font-size: 1.1rem;
    }

    .header-right {
      gap: 0.3rem;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      font-size: 0.95rem;
    }

    main {
      padding: 1rem 0.5rem;
    }

    .card {
      min-width: 140px;
      max-width: 180px;
    }

    .zoom-controls {
      bottom: 1rem;
      right: 1rem;
    }

    .zoom-btn {
      width: 40px;
      height: 40px;
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

<div id="app-container">
  <header>
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle" title="Menü">☰</button>
      <img class="crest" src="crest.png" alt="Familienwappen" width="56" height="56">
      <div class="header-title">
        <h1>Stammbaum</h1>
        <p class="subtitle">Nyffenegger · Meier · Künzi · Wetli</p>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="expandAllBtn" title="Alle aufklappen">⊕</button>
      <button class="icon-btn" id="collapseAllBtn" title="Alle zuklappen">⊖</button>
      <button class="icon-btn" id="fitViewBtn" title="Übersicht">⊡</button>
    </div>
  </header>

  <!-- SIDEBAR MENU -->
  <aside class="sidebar" id="sidebar">
    <div class="search-group">
      <h2>Suche</h2>
      <input type="text" id="search" placeholder="Name eingeben…" autocomplete="off">
      <span id="search-count"></span>
    </div>

    <div class="menu-group">
      <h2>Navigation</h2>
      <select id="jump">
        <option value="">Zweig springen zu …</option>
      </select>
    </div>

    <div class="menu-group">
      <h2>Hilfe</h2>
      <button id="legendToggle">Legende anzeigen</button>
    </div>

    <div id="data-source-sidebar" style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--gold); font-size: 0.75rem; color: var(--gold-light); font-family: 'IBM Plex Mono', monospace;"></div>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="view-overview">
    <div id="main"></div>
  </main>

<script>
// ===== NEUE UI KOMPONENTEN =====

const menuToggle = document.getElementById('menuToggle');
const sidebar = document.getElementById('sidebar');

menuToggle.addEventListener('click', () => {
  sidebar.classList.toggle('open');
});

// Sidebar schließen bei Klick außerhalb
document.addEventListener('click', (e) => {
  if (!sidebar.contains(e.target) && !menuToggle.contains(e.target) && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
  }
});

// ===== ZOOM FUNKTIONALITÄT =====
let currentZoom = 100;
const zoomIn = document.getElementById('zoomIn');
const zoomOut = document.getElementById('zoomOut');
const zoomLevel = document.getElementById('zoomLevel');
const main = document.getElementById('view-overview');

zoomIn.addEventListener('click', () => {
  currentZoom = Math.min(currentZoom + 10, 200);
  updateZoom();
});

zoomOut.addEventListener('click', () => {
  currentZoom = Math.max(currentZoom - 10, 50);
  updateZoom();
});

function updateZoom() {
  main.style.transform = `scale(${currentZoom / 100})`;
  main.style.transformOrigin = 'top center';
  zoomLevel.textContent = currentZoom + '%';
}

// Fit to view (Übersicht)
document.getElementById('fitViewBtn').addEventListener('click', () => {
  currentZoom = 100;
  updateZoom();
});

// Expand/Collapse Buttons (werden von app.js benutzt)
document.getElementById('expandAllBtn').addEventListener('click', () => {
  const event = new CustomEvent('expandAll');
  document.dispatchEvent(event);
});

document.getElementById('collapseAllBtn').addEventListener('click', () => {
  const event = new CustomEvent('collapseAll');
  document.dispatchEvent(event);
});

// Datenquelle im Sidebar anzeigen
function displayDataSource(text, className) {
  const el = document.getElementById('data-source-sidebar');
  if (el) {
    el.textContent = text;
    el.className = className;
  }
}

// Hack für alte app.js Kompatibilität
window.displayDataSource = displayDataSource;
</script>
<script src="app.js"></script>
</body>
